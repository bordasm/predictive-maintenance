apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: predmaint-models
  namespace: predictive-maintenance
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: predmaint-data
  namespace: predictive-maintenance
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
