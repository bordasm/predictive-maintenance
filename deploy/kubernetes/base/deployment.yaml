apiVersion: apps/v1
kind: Deployment
metadata:
  name: predmaint-api
  namespace: predictive-maintenance
  labels:
    app.kubernetes.io/name: predmaint-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: predmaint-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predmaint-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/bordasm/predictive-maintenance:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PREDMAINT_CHAMPION_MANIFEST
              value: /models/champion.json
            - name: PREDMAINT_PREDICTION_DB
              value: /data/predictions.db
            - name: PREDMAINT_MAX_REQUEST_BYTES
              value: "1048576"
            - name: PREDMAINT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: predmaint-api-secrets
                  key: api-key
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: predmaint-models
        - name: data
          persistentVolumeClaim:
            claimName: predmaint-data
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
