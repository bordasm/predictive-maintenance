groups:
  - name: predictive-maintenance-api
    rules:
      - alert: PredictiveMaintenanceApiDown
        expr: up{job="predictive-maintenance-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Predictive-maintenance API is unavailable
          description: Prometheus has been unable to scrape the API for two minutes.

      - alert: PredictiveMaintenanceHighErrorRate
        expr: |
          sum(rate(predmaint_http_requests_total{path="/v1/predict",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(predmaint_http_requests_total{path="/v1/predict"}[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prediction API error budget is being consumed
          description: More than 1% of prediction requests returned a 5xx response.

      - alert: PredictiveMaintenanceHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(predmaint_http_request_duration_seconds_bucket{path="/v1/predict"}[5m])
            )
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prediction API p95 latency is above its objective
          description: The five-minute p95 latency has exceeded 500 ms for ten minutes.

      - alert: PredictiveMaintenanceServiceNotReady
        expr: predmaint_service_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Inference service is running but not ready
          description: The model or prediction store is not ready to serve requests.
