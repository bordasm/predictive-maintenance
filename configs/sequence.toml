[data]
raw_dir = "data/raw/azure_pdm"
feature_path = "data/processed/azure_pdm_features.parquet"

[tracking]
database = "mlflow.db"
artifact_directory = "mlruns"
experiment_name = "azure-pdm-sequence-challengers"

[evaluation]
horizon_hours = 24

[window]
size = 48

[training]
device = "auto"
seed = 42
epochs = 6
patience = 2
batch_size = 512
learning_rate = 0.001
weight_decay = 0.0001
train_negative_stride = 6
early_stopping_validation_stride = 3

[lstm]
hidden_size = 64
num_layers = 1
dropout = 0.1

[transformer]
d_model = 48
nhead = 4
num_layers = 2
dim_feedforward = 96
dropout = 0.1

[incumbent]
model_path = "artifacts/experiments/hist_gradient_boosting.joblib"
mlflow_run_id = "97293e9d3f3a456998d7785bc1ac9f72"

[output]
artifact_dir = "artifacts/sequence"
report_dir = "reports/sequence_comparison"
